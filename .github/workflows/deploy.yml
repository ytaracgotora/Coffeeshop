    steps:
      - name: 🏁 Checkout Code
        uses: actions/checkout@v4

      # 🔥 SENIOR MOVE: Install the specific SDK needed for the build
      - name: 🛠️ Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🔑 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🏗️ Build Migration Bundle
        run: |
          dotnet tool install --global dotnet-ef
          # We add the 'export PATH' to make sure the runner can find 'dotnet-ef' immediately
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations bundle --project CoffeeShop.Shared --startup-project CoffeeShop.Api --self-contained -r linux-x64 -o efbundle --force

name: ☕ Coffee Shop Cloud Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      - name: 🏁 Checkout Code
        uses: actions/checkout@v4

      # 🔥 SENIOR MOVE: Manually wipe out any Windows 'obj' or 'bin' folders 
      # that were accidentally committed. This solves the MSB4018 error.
      - name: 🧹 Clean Artifacts
        run: find . -type d -name "obj" -exec rm -rf {} +; find . -type d -name "bin" -exec rm -rf {} +

      - name: 🛠️ Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🔑 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🏗️ Build Migration Bundle
        run: |
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"

          # 🔥 SENIOR MOVE: Restore the entire solution so all projects are ready
          dotnet restore
          
          dotnet ef migrations bundle \
            --project CoffeeShop.Shared \
            --startup-project CoffeeShop.Api \
            --self-contained -r linux-x64 -o efbundle --force

      - name: 🐳 Build & Push Images to ACR
        run: |
          az acr build --registry ${{ secrets.ACR_NAME }} --image coffee-api:${{ github.sha }} -f CoffeeShop.Api/Dockerfile .
          az acr build --registry ${{ secrets.ACR_NAME }} --image coffee-worker:${{ github.sha }} -f CoffeeShop.Worker/Dockerfile .
          az acr build --registry ${{ secrets.ACR_NAME }} --image coffee-migrator:${{ github.sha }} -f Dockerfile.migrator .

      - name: 🚜 Run Database Migrations
        run: |
          az containerapp job start --name coffee-db-migrator --resource-group CoffeeShop_RG
